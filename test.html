<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Root Cyber Localhost Security Test</title>
</head>
<body>
  <h2>Root Cyber Browser Security Test</h2>

  <p>Testing automatic localhost access...</p>

  <pre id="result">Waiting for automatic test...</pre>

  <script>
    window.addEventListener("load", async () => {
      const output = document.getElementById("result");

      try {
        const response = await fetch(
          "http://127.0.0.1:8000/health"
        );

        const body = await response.text();

        output.textContent =
          "Automatic localhost request completed.\n" +
          "HTTP Status: " + response.status + "\n" +
          "Response:\n" + body;

      } catch (error) {
        output.textContent =
          "Automatic localhost request blocked or failed.\n" +
          "Error: " + error;
      }
    });
  </script>
</body>
</html>
