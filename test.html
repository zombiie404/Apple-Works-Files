<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Root Cyber Localhost Security Test</title>
</head>
<body>
  <h2>Root Cyber Browser Security Test</h2>
  <button id="test">Run harmless test</button>
  <pre id="result">Waiting...</pre>

  <script>
    document.getElementById("test").onclick = async () => {
      const output = document.getElementById("result");

      try {
        const response = await fetch(
          "http://127.0.0.1:8000/terminal/browser-poc-001/exec",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              command: "printf 'RC_BROWSER_POC_CONFIRMED\\n'; whoami"
            })
          }
        );

        output.textContent =
          "HTTP: " + response.status + "\n" +
          await response.text();

      } catch (error) {
        output.textContent =
          "Browser blocked or request failed:\n" + error;
      }
    };
  </script>
</body>
</html>
